name: Smart Student Assistant — Flutter CI & APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      ai_endpoint:
        description: "AI API endpoint used by the Flutter application"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: smart-student-assistant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  verify_flutter:
    name: Verify Flutter
    runs-on: ubuntu-latest

    env:
      AI_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_endpoint || secrets.AI_ENDPOINT }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Verify Flutter project structure
        run: |
          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart

      - name: Verify Android project structure
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/example/smart_student_assistant/MainActivity.kt

      - name: Create Android local.properties
        working-directory: android
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Format Dart source files
        run: |
          dart format lib test

      - name: Analyze Dart and Flutter source code
        run: |
          flutter analyze

      - name: Run Flutter tests
        run: |
          flutter test

      - name: Verify AI endpoint configuration
        run: |
          if [ -n "$AI_ENDPOINT" ]; then
            echo "AI_ENDPOINT is configured."
          else
            echo "AI_ENDPOINT is not configured."
            echo "The application will use its default endpoint configuration."
          fi

  build_android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs:
      - verify_flutter

    env:
      AI_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_endpoint || secrets.AI_ENDPOINT }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Show Flutter, Dart, Java and Gradle versions
        run: |
          flutter --version
          dart --version
          java -version
          gradle --version

      - name: Verify Android project files
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/example/smart_student_assistant/MainActivity.kt

      - name: Create Android local.properties
        working-directory: android
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Format Dart source files
        run: |
          dart format lib test

      - name: Analyze Dart and Flutter source code
        run: |
          flutter analyze

      - name: Run Flutter tests
        run: |
          flutter test

      - name: Prepare AI endpoint Dart define
        shell: bash
        run: |
          if [ -n "$AI_ENDPOINT" ]; then
            DART_DEFINE_VALUE="AI_ENDPOINT=$AI_ENDPOINT"
            DART_DEFINES="$(printf '%s' "$DART_DEFINE_VALUE" | base64 -w 0)"
            echo "DART_DEFINES=$DART_DEFINES" >> "$GITHUB_ENV"
            echo "AI endpoint Dart define prepared."
          else
            echo "DART_DEFINES=" >> "$GITHUB_ENV"
            echo "No AI endpoint was provided."
          fi

      - name: Clean Flutter build
        run: |
          flutter clean

      - name: Get Flutter dependencies after clean
        run: |
          flutter pub get

      - name: Build Android release APK with AI endpoint
        if: env.DART_DEFINES != ''
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace -Pdart-defines="$DART_DEFINES"

      - name: Build Android release APK without AI endpoint
        if: env.DART_DEFINES == ''
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Verify generated APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-student-assistant-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
