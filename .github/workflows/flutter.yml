name: Smart Student Assistant — Flutter CI & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}

jobs:
  verify:
    name: Verify Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: flutter build web --release --dart-define=AI_ENDPOINT=${AI_ENDPOINT}
      - uses: actions/upload-artifact@v4
        with:
          name: smart-student-assistant-web-${{ github.sha }}
          path: build/web
          retention-days: 14

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android .
      - run: flutter build apk --release --dart-define=AI_ENDPOINT=${AI_ENDPOINT}
      - uses: actions/upload-artifact@v4
        with:
          name: smart-student-assistant-${{ github.sha }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
