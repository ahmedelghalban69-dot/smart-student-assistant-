name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      ai_endpoint:
        description: 'HTTPS backend /ai endpoint, e.g. https://your-backend.example.com/ai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
         
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android .
      - run: flutter build apk --release --dart-define=AI_ENDPOINT=${{ inputs.ai_endpoint }}
      - uses: actions/upload-artifact@v4
        with:
          name: smart-student-assistant-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
