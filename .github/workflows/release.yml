name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      ai_endpoint:
        description: 'HTTPS backend /ai endpoint'
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Android project
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Configure Flutter SDK for Gradle
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Build Release APK
        env:
          AI_ENDPOINT: ${{ inputs.ai_endpoint }}
        run: |
          DART_DEFINES=$(printf 'AI_ENDPOINT=%s' "$AI_ENDPOINT" | base64 -w0)
          gradle -p android assembleRelease --no-daemon --stacktrace -Pdart-defines="$DART_DEFINES"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-student-assistant-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
