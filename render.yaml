services:
  - type: web
    name: smart-student-assistant-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_URL
        value: https://api.openai.com/v1/responses
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AI_TIMEOUT_MS
        value: "45000"
